# nginx-Site der Sponsorenlauf-App. Wird von install.sh nach /etc/nginx/sites-available/<name> kopiert.
# certbot --nginx ergänzt anschließend HTTPS und die Weiterleitung von http auf https.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    client_max_body_size 10m;   # Handyfotos

    location /admin {
        auth_basic           "@NAME@ Admin";
        auth_basic_user_file /etc/nginx/@NAME@.htpasswd;
        proxy_pass         http://127.0.0.1:@PORT@;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_read_timeout 120s;   # PDF-Export, SMTP-Test
    }

    location / {
        proxy_pass         http://127.0.0.1:@PORT@;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
    }
}
